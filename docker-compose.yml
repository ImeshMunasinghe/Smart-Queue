
services:
  postgres:
    image: postgres:16-alpine
    container_name: smartqueue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartqueue_db
      POSTGRES_USER: smartqueue_user
      POSTGRES_PASSWORD: smartqueue_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartqueue_user -d smartqueue_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartqueue-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prediction-service:
    build:
      context: ./prediction
      dockerfile: Dockerfile
    container_name: smartqueue-prediction
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    depends_on:
      - redis

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartqueue-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartqueue_db
      SPRING_DATASOURCE_USERNAME: smartqueue_user
      SPRING_DATASOURCE_PASSWORD: smartqueue_secure_password
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_FLYWAY_ENABLED: "true"
      PREDICTION_SERVICE_URL: http://prediction-service:8000
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prediction-service:
        condition: service_started

volumes:
  pgdata:
    driver: local
