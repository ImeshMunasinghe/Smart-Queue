spring.application.name=smart-queue-backend-test

# H2 in-memory PostgreSQL-compatible database for tests
spring.datasource.url=jdbc:h2:mem:smartqueuetestdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Flyway is disabled in tests: V1 migration uses PostgreSQL-specific CREATE EXTENSION
# which H2 does not support. JPA ddl-auto=create-drop creates tables from entities instead.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Redis auto-configuration excluded — mock RedisTemplate injected via MockRedisConfig
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# JWT test secret (base64-encoded 64-char string for HS256)
jwt.secret=c21hcnRxdWV1ZS1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLUhTMjU2LXNpZ25pbmc=
jwt.expiration-hours=8

# Rate limit — effectively unlimited in tests (no real Redis)
rate.limit.requests-per-window=1000
rate.limit.window-seconds=60

prediction.service.url=http://localhost:8000
queue.called-timeout-minutes=3
queue.overbooking.default-risk-threshold=0.10
