spring.application.name=smart-queue-backend

# Default Datasource (H2 in PostgreSQL mode for instant local dev / testing if postgres container is stopped)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smartqueuedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway: runs database migrations (seeds pilot office and service types)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# Server & Management
server.port=8080
management.endpoints.web.exposure.include=health,info,metrics

# Prediction Service URL
prediction.service.url=${PREDICTION_SERVICE_URL:http://localhost:8000}

# Queue Policies
queue.called-timeout-minutes=3
queue.overbooking.default-risk-threshold=0.10

# ── Redis Connection ──────────────────────────────────────────────────────────
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ── JWT Security ──────────────────────────────────────────────────────────────
# 64-char base64-safe secret key for HS256 (change in production)
jwt.secret=${JWT_SECRET:c21hcnRxdWV1ZS1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLUhTMjU2LXNpZ25pbmc=}
jwt.expiration-hours=8

# ── Rate Limiting (token issuance per IP) ────────────────────────────────────
rate.limit.requests-per-window=10
rate.limit.window-seconds=60
